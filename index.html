<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="United Dream Limited builds and supports a portfolio of ambitious technology ventures.">
    <title>United Dream Limited</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #090c16; color: #f5f7ff; }
      main { width: min(72rem, 100%); padding: clamp(2rem, 8vw, 7rem); }
      p:first-child { color: #8fb7ff; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
      h1 { max-width: 12ch; margin: .35em 0; font-size: clamp(3rem, 9vw, 7.5rem); line-height: .92; letter-spacing: -.06em; }
      p:last-child { max-width: 42rem; color: #b9c1d6; font-size: clamp(1.1rem, 2vw, 1.45rem); line-height: 1.65; }
    </style>
  </head>
  <body>
    <main>
      <p>United Dream Limited</p>
      <h1>Building what comes next.</h1>
      <p>We are the parent company behind a portfolio of technology ventures. A new corporate experience is on its way.</p>
    </main>
  </body>
</html>
